[project]
name = "mojo-shap"
version = "0.1.0"
description = "Exact TreeSHAP and model-agnostic Kernel SHAP accelerated with Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
dependencies = ["numpy", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest", "scikit-learn", "shap"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
